name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: firebase-hosting-main
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build Flutter Web + Deploy Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # --pwa-strategy=none: sin service worker. El SW de Flutter cacheaba
      # navegaciones y hacia que /catalogo/* mostrara index.html (la app).
      - name: Build web
        run: flutter build web --release --pwa-strategy=none

      - name: Copy catalog assets into build/web
        run: |
          set -euo pipefail
          mkdir -p build/web/catalogo
          cp -a web/catalogo/. build/web/catalogo/
          # Por si Flutter genero un SW residual, eliminarlo del artefacto.
          rm -f build/web/flutter_service_worker.js
          echo "Archivos estaticos de catalogo a desplegar:"
          find build/web/catalogo -type f | sort
          test -f build/web/catalogo/admin.html
          test -n "$(find build/web/catalogo -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.html' -o -iname '*.json' \) | head -n 1)"

      - name: Verify catalog assets are not SPA-only
        run: |
          set -euo pipefail
          # Asegurar que no se despliega un SW que controle /catalogo
          if [ -f build/web/flutter_service_worker.js ]; then
            echo "ERROR: flutter_service_worker.js no debe existir en el deploy"
            exit 1
          fi
          ls -la build/web/catalogo/90915-YZZD2.jpg
          file build/web/catalogo/90915-YZZD2.jpg

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: repuestospro-prod
